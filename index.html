<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리랜서 촬영일정 및 입금일 관리</title>
    <style>
        :root {
            --bg-color: #121218;
            --panel-bg: #1e1e26;
            --card-bg: #fffbcf; /* 노란색 카드 */
            --card-border: #f6e05e;
            --text-dark: #1a202c;
            --text-light: #f7fafc;
            --text-muted: #a0aec0;
            --primary-accent: #10b981; /* 초록색 강조 */
            --primary-hover: #059669;
            --warning-accent: #f59e0b; /* D-3 경고 */
            --danger-accent: #ef4444; /* 입금 지연 */
            --completed-bg: #2d3748;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            text-align: center;
            padding: 16px 0;
            border-bottom: 1px solid #2d3748;
        }

        header h1 {
            font-size: 1.8rem;
            color: #fef08a; /* 연한 노랑 */
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 24px;
        }

        @media (max-width: 850px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 패널 공통 스타일 */
        .panel {
            background-color: var(--panel-bg);
            border-radius: var(--border-radius);
            padding: 24px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            border: 1px solid #2d2d3a;
        }

        .panel-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* 폼 요소 스타일 */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 6px;
            color: #cbd5e0;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: #121218;
            border: 1px solid #3f3f4e;
            border-radius: 8px;
            color: var(--text-light);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-accent);
        }

        /* 날짜 입력 아이콘 노란색 처리 */
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(82%) sepia(85%) saturate(900%) hue-rotate(350deg) brightness(108%) contrast(105%);
            opacity: 1;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-size: 0.95rem;
            gap: 6px;
        }

        .btn-primary {
            background-color: var(--primary-accent);
            color: #ffffff;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-clear {
            background-color: transparent;
            border: 1px solid #3f3f4e;
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .btn-clear:hover {
            background-color: #2a2a35;
            color: var(--text-main);
        }

        /* 엑셀 저장 버튼 스타일 */
        .btn-excel {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--primary-accent);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .btn-excel:hover {
            background-color: var(--primary-accent);
            color: #000000;
        }

        .btn-excel-all {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--warning-accent);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .btn-excel-all:hover {
            background-color: var(--warning-accent);
            color: #000000;
        }

        /* 대시보드 통계 카운터 */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-item {
            background-color: #121218;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2d2d3a;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 800;
        }

        /* 일정 목록 영역 */
        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .schedule-list::-webkit-scrollbar {
            width: 6px;
        }
        .schedule-list::-webkit-scrollbar-thumb {
            background-color: #3f3f4e;
            border-radius: 3px;
        }

        /* 노란색 메인 카드 디자인 */
        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: var(--border-radius);
            padding: 18px;
            color: var(--text-dark);
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(246, 224, 94, 0.25);
        }

        /* 입금 임박/D-Day 강조 테두리 */
        .card.urgent {
            border: 3px solid var(--warning-accent);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }

        /* 입금 완료 카드 스타일 */
        .card.completed {
            background-color: var(--completed-bg);
            border-color: #4a5568;
            color: #a0aec0;
            opacity: 0.75;
        }

        .card.completed:hover {
            transform: none;
            box-shadow: none;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 800;
            word-break: break-all;
        }

        .d-day-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.85rem;
            white-space: nowrap;
            background-color: var(--text-dark);
            color: #ffffff;
        }

        .card.urgent .d-day-badge {
            background-color: var(--warning-accent);
            color: #000000;
            animation: pulse 1.5s infinite;
        }

        .card.overdue .d-day-badge {
            background-color: var(--danger-accent);
            color: #ffffff;
        }

        .card.completed .d-day-badge {
            background-color: var(--primary-accent);
            color: #ffffff;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.875rem;
            background-color: rgba(255, 255, 255, 0.4);
            padding: 10px 12px;
            border-radius: 8px;
        }

        .card.completed .card-body {
            background-color: rgba(0, 0, 0, 0.2);
        }

        .info-label {
            color: #4a5568;
            font-size: 0.75rem;
            margin-bottom: 2px;
        }

        .card.completed .info-label {
            color: #718096;
        }

        .info-value {
            font-weight: 700;
        }

        .amount-highlight {
            font-size: 1rem;
            color: #1a202c;
            font-weight: 800;
        }

        .card.completed .amount-highlight {
            color: #cbd5e0;
        }

        .memo-text {
            font-size: 0.8rem;
            color: #4a5568;
            grid-column: span 2;
            margin-top: 4px;
            border-top: 1px dashed rgba(0,0,0,0.1);
            padding-top: 4px;
        }

        .card.completed .memo-text {
            color: #718096;
            border-top-color: rgba(255,255,255,0.1);
        }

        .card-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-status {
            background-color: var(--primary-accent);
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-status:hover {
            background-color: var(--primary-hover);
        }

        .btn-undo {
            background-color: #4a5568;
            color: #ffffff;
        }

        .btn-undo:hover {
            background-color: #2d3748;
        }

        .btn-delete {
            background-color: transparent;
            color: #e53e3e;
            border: 1px solid #e53e3e;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .card.completed .btn-delete {
            color: #fc8181;
            border-color: #fc8181;
        }

        .btn-delete:hover {
            background-color: #e53e3e;
            color: #ffffff;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* 검증 에러 알림 */
        .alert-box {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger-accent);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }

        /* 삭제 확인 커스텀 모달 팝업 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background-color: var(--panel-bg);
            border: 2px solid var(--warning-accent);
            border-radius: var(--border-radius);
            padding: 24px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transform: scale(0.9);
            transition: transform 0.25s ease;
            text-align: center;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .modal-desc {
            font-size: 0.9rem;
            color: #cbd5e0;
            line-height: 1.5;
            margin-bottom: 20px;
            word-break: keep-all;
        }

        .modal-desc strong {
            color: #fca5a5;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-modal-cancel {
            background-color: #3f3f4e;
            color: var(--text-light);
            flex: 1;
        }

        .btn-modal-cancel:hover {
            background-color: #4a5568;
        }

        .btn-modal-confirm {
            background-color: var(--danger-accent);
            color: #ffffff;
            flex: 1;
        }

        .btn-modal-confirm:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📷 프리랜서 촬영 & 입금일 매니저</h1>
            <p>촬영 일정 등록부터 디데이 확인, 정산 엑셀 내보내기까지 스마트하게 관리하세요</p>
        </header>

        <div class="main-layout">
            <!-- 좌측: 일정 입력 영역 -->
            <section class="panel">
                <div class="panel-title">새 촬영 일정 등록</div>
                <div id="alertBox" class="alert-box"></div>

                <form id="scheduleForm" onsubmit="handleFormSubmit(event)">
                    <div class="form-group">
                        <label for="title">촬영 건명 / 클라이언트 *</label>
                        <input type="text" id="title" class="form-control" placeholder="예: A기업 브랜드 화보 촬영" required>
                    </div>

                    <div class="form-group">
                        <label for="shootDate">촬영일 *</label>
                        <input type="date" id="shootDate" class="form-control" onchange="autoSetPayDate()" required>
                    </div>

                    <div class="form-group">
                        <label for="payDate">입금 예정일 * (기본 1달 뒤 자동설정)</label>
                        <input type="date" id="payDate" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">페이 금액 (원)</label>
                        <input type="text" id="amount" class="form-control" placeholder="예: 500,000" oninput="formatCurrency(this)">
                    </div>

                    <div class="form-group">
                        <label for="memo">메모</label>
                        <textarea id="memo" class="form-control" rows="2" placeholder="세부 조건, 추가 착장 수 등 기록"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">➕ 일정 등록하기</button>
                </form>
            </section>

            <!-- 우측: 일정 목록 및 관리 영역 -->
            <section class="panel">
                <div class="panel-title">
                    <span>일정 및 입금 목록</span>
                    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                        <button class="btn btn-excel" onclick="exportToExcel('completed')" title="입금 완료된 내역만 엑셀로 저장">
                            📊 완료건 엑셀 저장
                        </button>
                        <button class="btn btn-excel-all" onclick="exportToExcel('all')" title="전체 내역을 엑셀로 저장">
                            📥 전체 엑셀 저장
                        </button>
                    </div>
                </div>

                <!-- 대시보드 요약 정보 -->
                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-label">전체 촬영</div>
                        <div class="stat-value" id="statTotal">0건</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">입금 대기</div>
                        <div class="stat-value" style="color: var(--warning-accent);" id="statPending">0건</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">입금 완료</div>
                        <div class="stat-value" style="color: var(--primary-accent);" id="statCompleted">0건</div>
                    </div>
                </div>

                <!-- 촬영 카드 목록 -->
                <div id="scheduleList" class="schedule-list">
                    <!-- JavaScript dynamic rendering -->
                </div>
            </section>
        </div>
    </div>

    <!-- 삭제 확인 커스텀 모달 팝업 -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-icon">⚠️</div>
            <div class="modal-title">정말로 삭제하시겠습니까?</div>
            <div class="modal-desc">
                삭제하시면 <strong>엑셀파일에 저장하실 수 없습니다.</strong><br>
                이 작업은 취소할 수 없습니다.
            </div>
            <div class="modal-actions">
                <button class="btn btn-modal-cancel" onclick="closeDeleteModal()">취소</button>
                <button class="btn btn-modal-confirm" onclick="confirmDelete()">삭제하기</button>
            </div>
        </div>
    </div>

    <script>
        // 로컬스토리지 키 설정
        const STORAGE_KEY = 'freelancer_schedules_data';
        let schedules = [];
        let pendingDeleteId = null; // 삭제 대기 중인 항목 ID

        // 앱 초기화
        window.onload = function() {
            loadSchedules();
            initDefaultDates();
            render();
        };

        // 로컬스토리지에서 데이터 로드
        function loadSchedules() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    schedules = JSON.parse(saved);
                } catch (e) {
                    schedules = [];
                }
            }
        }

        // 로컬스토리지에 저장
        function saveSchedules() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(schedules));
        }

        // 입력 폼 기본 날짜 세팅 (오늘 촬영일 -> 한달뒤 입금일)
        function initDefaultDates() {
            const today = new Date();
            const todayStr = formatDate(today);
            document.getElementById('shootDate').value = todayStr;
            autoSetPayDate();
        }

        // 촬영일 지정 시 1달 뒤 입금일 자동 계산
        function autoSetPayDate() {
            const shootDateInput = document.getElementById('shootDate').value;
            if (!shootDateInput) return;

            const shootDate = new Date(shootDateInput);
            shootDate.setMonth(shootDate.getMonth() + 1);
            
            document.getElementById('payDate').value = formatDate(shootDate);
        }

        // YYYY-MM-DD 포맷터
        function formatDate(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        // 화폐 단위 천단위 콤마 생성
        function formatCurrency(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if (value) {
                input.value = Number(value).toLocaleString();
            } else {
                input.value = '';
            }
        }

        // 사용자 입력 검증 및 에러 메시지
        function showAlert(msg) {
            const box = document.getElementById('alertBox');
            box.innerText = msg;
            box.style.display = 'block';
        }

        function hideAlert() {
            const box = document.getElementById('alertBox');
            box.style.display = 'none';
        }

        // 일정 제출 등록 처리
        function handleFormSubmit(event) {
            event.preventDefault();
            hideAlert();

            const title = document.getElementById('title').value.trim();
            const shootDate = document.getElementById('shootDate').value;
            const payDate = document.getElementById('payDate').value;
            const amount = document.getElementById('amount').value.trim();
            const memo = document.getElementById('memo').value.trim();

            if (!title) {
                showAlert('촬영 건명을 입력해 주세요.');
                return;
            }
            if (!shootDate || !payDate) {
                showAlert('촬영일과 입금 예정일을 모두 선택해 주세요.');
                return;
            }

            const newSchedule = {
                id: Date.now().toString(),
                title: title,
                shootDate: shootDate,
                payDate: payDate,
                amount: amount || '0',
                memo: memo,
                completed: false,
                createdAt: new Date().toISOString()
            };

            schedules.push(newSchedule);
            saveSchedules();
            render();

            // 폼 초기화
            document.getElementById('title').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('memo').value = '';
            initDefaultDates();
        }

        // 상태 전환 (완료/되돌리기)
        function toggleComplete(id) {
            schedules = schedules.map(item => {
                if (item.id === id) {
                    return { ...item, completed: !item.completed };
                }
                return item;
            });
            saveSchedules();
            render();
        }

        // 개별 삭제 모달 열기
        function openDeleteModal(id) {
            pendingDeleteId = id;
            const modal = document.getElementById('deleteModal');
            modal.classList.add('active');
        }

        // 삭제 모달 닫기
        function closeDeleteModal() {
            pendingDeleteId = null;
            const modal = document.getElementById('deleteModal');
            modal.classList.remove('active');
        }

        // 모달에서 삭제 확정 시 실행
        function confirmDelete() {
            if (pendingDeleteId) {
                schedules = schedules.filter(item => item.id !== pendingDeleteId);
                saveSchedules();
                render();
            }
            closeDeleteModal();
        }

        // D-Day 및 계산 규칙 구현
        function calculateDDay(payDateStr) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const payDate = new Date(payDateStr);
            payDate.setHours(0, 0, 0, 0);

            const diffTime = payDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays === 0) {
                return { text: 'D-Day (오늘 입금일)', isUrgent: true, isOverdue: false };
            } else if (diffDays > 0 && diffDays <= 3) {
                return { text: `D-${diffDays} (입금 임박)`, isUrgent: true, isOverdue: false };
            } else if (diffDays > 3) {
                return { text: `D-${diffDays}`, isUrgent: false, isOverdue: false };
            } else {
                return { text: `${Math.abs(diffDays)}일 지남`, isUrgent: false, isOverdue: true };
            }
        }

        // 엑셀(CSV) 다운로드 기능 (세무사용)
        function exportToExcel(type = 'completed') {
            let targetSchedules = [];

            if (type === 'completed') {
                targetSchedules = schedules.filter(item => item.completed);
                if (targetSchedules.length === 0) {
                    showAlert('엑셀로 내보낼 입금 완료 항목이 없습니다.');
                    setTimeout(hideAlert, 3000);
                    return;
                }
            } else {
                targetSchedules = [...schedules];
                if (targetSchedules.length === 0) {
                    showAlert('등록된 일정 데이터가 없습니다.');
                    setTimeout(hideAlert, 3000);
                    return;
                }
            }

            const headers = ['촬영 건명/클라이언트', '촬영일', '입금 예정일', '페이 금액(원)', '입금 상태', '메모'];
            
            const rows = targetSchedules.map(item => {
                const title = `"${(item.title || '').replace(/"/g, '""')}"`;
                const shootDate = `"${item.shootDate || ''}"`;
                const payDate = `"${item.payDate || ''}"`;
                const amount = `"${(item.amount || '0').replace(/,/g, '')}"`;
                const status = `"${item.completed ? '입금 완료' : '입금 대기'}"`;
                const memo = `"${(item.memo || '').replace(/"/g, '""')}"`;

                return [title, shootDate, payDate, amount, status, memo].join(',');
            });

            // BOM(\uFEFF)으로 엑셀 한글 깨짐 방지
            const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            
            const todayStr = new Date().toISOString().split('T')[0];
            const fileName = type === 'completed' 
                ? `프리랜서_입금완료_정산목록_${todayStr}.csv` 
                : `프리랜서_전체촬영_정산목록_${todayStr}.csv`;

            link.setAttribute('href', url);
            link.setAttribute('download', fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            hideAlert();
        }

        // 화면 렌더링 함수
        function render() {
            const listContainer = document.getElementById('scheduleList');
            
            // 통계 업데이트
            document.getElementById('statTotal').innerText = `${schedules.length}건`;
            document.getElementById('statPending').innerText = `${schedules.filter(s => !s.completed).length}건`;
            document.getElementById('statCompleted').innerText = `${schedules.filter(s => s.completed).length}건`;

            if (schedules.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        등록된 촬영 일정이 없습니다.<br>좌측 폼에서 새로운 일정을 등록해 보세요!
                    </div>
                `;
                return;
            }

            // 정렬 규칙: 1. 미완료 항목 먼저, 2. 입금 예정일 오름차순
            const sortedSchedules = [...schedules].sort((a, b) => {
                if (a.completed !== b.completed) {
                    return a.completed ? 1 : -1;
                }
                return new Date(a.payDate) - new Date(b.payDate);
            });

            let html = '';
            sortedSchedules.forEach(item => {
                const ddayInfo = calculateDDay(item.payDate);
                
                let cardClass = 'card';
                if (item.completed) {
                    cardClass += ' completed';
                } else if (ddayInfo.isUrgent) {
                    cardClass += ' urgent';
                } else if (ddayInfo.isOverdue) {
                    cardClass += ' overdue';
                }

                html += `
                    <div class="${cardClass}">
                        <div class="card-header">
                            <div class="card-title">${escapeHtml(item.title)}</div>
                            <span class="d-day-badge">${item.completed ? '입금 완료' : ddayInfo.text}</span>
                        </div>
                        <div class="card-body">
                            <div>
                                <div class="info-label">촬영일</div>
                                <div class="info-value">📅 ${item.shootDate}</div>
                            </div>
                            <div>
                                <div class="info-label">입금 예정일</div>
                                <div class="info-value">💰 ${item.payDate}</div>
                            </div>
                            <div style="grid-column: span 2;">
                                <div class="info-label">페이 금액</div>
                                <div class="amount-highlight">${item.amount ? item.amount + ' 원' : '미기재'}</div>
                            </div>
                            ${item.memo ? `<div class="memo-text">📝 ${escapeHtml(item.memo)}</div>` : ''}
                        </div>
                        <div class="card-footer">
                            <button class="btn-status ${item.completed ? 'btn-undo' : ''}" onclick="toggleComplete('${item.id}')">
                                ${item.completed ? '↺ 미완료로 변경' : '✓ 입금 완료 처리'}
                            </button>
                            <button class="btn-delete" onclick="openDeleteModal('${item.id}')">삭제</button>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;
        }

        // XSS 방지용 HTML 이스케이프
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
